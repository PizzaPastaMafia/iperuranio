services:
  website:
    image: nginx:alpine
    restart: unless-stopped

    volumes:
      - ./html:/usr/share/nginx/html:ro

    networks:
      - internalProxy

    labels:
      - traefik.enable=true

      - traefik.http.routers.${SITE_NAME}.rule=Host(`${SITE_NAME}.${DOMAIN}`)
      - traefik.http.routers.${SITE_NAME}.entrypoints=websecure
      - traefik.http.routers.${SITE_NAME}.tls=true
      - traefik.http.routers.${SITE_NAME}.tls.certresolver=duckdns

      - traefik.http.services.${SITE_NAME}.loadbalancer.server.port=80

networks:
  internalProxy:
    external: true
